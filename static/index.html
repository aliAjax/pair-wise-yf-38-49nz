<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因组数据访问治理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .4rem .7rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #d1d5db; padding: .45rem .6rem; text-align: left; font-size: .9rem; vertical-align: top; }
    th { background: #f9fafb; }
    .badge { display: inline-block; padding: .1rem .45rem; border-radius: 999px; background: #fee2e2; color: #991b1b; font-size: .8rem; }
    .muted { color: #6b7280; font-size: .85rem; }
    h2 { margin-top: 2rem; }
  </style>
</head>
<body>
<main>
  <h1>基因组数据访问治理 · 机构停用治理</h1>
  <p>
    <label>当前身份
      <input id="userId" value="admin-1" size="12">
      <select id="role">
        <option value="admin">admin</option>
        <option value="auditor">auditor</option>
        <option value="committee">committee</option>
        <option value="applicant">applicant</option>
        <option value="viewer">viewer</option>
      </select>
    </label>
    <label>机构过滤 <input id="recipient" placeholder="recipient / applicant_id（可空）"></label>
    <button onclick="refresh()">刷新治理视图</button>
    <button onclick="checkHealth()">检查服务状态</button>
  </p>

  <h2>未结申请 <span class="muted" id="openCount"></span></h2>
  <table>
    <thead><tr><th>ID</th><th>状态</th><th>申请机构</th><th>数据集</th><th>用途</th></tr></thead>
    <tbody id="openApplications"></tbody>
  </table>

  <h2>待核销毁回执 <span class="badge">未核对将阻断新凭证启用与申请审批</span></h2>
  <table>
    <thead><tr><th>ID</th><th>凭证</th><th>机构</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="pendingReceipts"></tbody>
  </table>

  <h2>待续项 <span class="muted" id="pendingCount"></span></h2>
  <table>
    <thead><tr><th>ID</th><th>类型</th><th>尝试次数</th><th>最近错误</th><th>操作</th></tr></thead>
    <tbody id="pendingItems"></tbody>
  </table>

  <pre id="result">等待操作</pre>
</main>
<script>
function headers(method) {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value,
    'X-Role': document.getElementById('role').value
  };
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function refresh() {
  const recipient = document.getElementById('recipient').value.trim();
  const url = '/api/governance' + (recipient ? '?recipient=' + encodeURIComponent(recipient) : '');
  const response = await fetch(url, {headers: {'X-User-Id': document.getElementById('userId').value, 'X-Role': document.getElementById('role').value}});
  if (!response.ok) {
    document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
    return;
  }
  const summary = await response.json();
  document.getElementById('openCount').textContent = '（' + summary.open_applications.length + '）';
  document.getElementById('pendingCount').textContent = '（' + summary.pending_items.length + '）';
  document.getElementById('openApplications').innerHTML = summary.open_applications.map(a =>
    `<tr><td>${esc(a.id)}</td><td><span class="badge">${esc(a.status)}</span></td><td>${esc(a.data.applicant_id)}</td><td>${esc(a.data.dataset_id)}</td><td>${esc(a.data.purpose)}</td></tr>`
  ).join('') || '<tr><td colspan="5" class="muted">无未结申请</td></tr>';
  document.getElementById('pendingReceipts').innerHTML = summary.pending_receipts.map(r =>
    `<tr><td>${esc(r.id)}</td><td>${esc(r.data.grant_id)}</td><td>${esc(r.data.recipient)}</td><td><span class="badge">${esc(r.status)}</span></td>`
    + `<td><button onclick="verifyReceipt('${esc(r.id)}', ${r.version})">核对通过</button></td></tr>`
  ).join('') || '<tr><td colspan="5" class="muted">无待核回执</td></tr>';
  document.getElementById('pendingItems').innerHTML = summary.pending_items.map(p =>
    `<tr><td>${esc(p.id)}</td><td>${esc(p.kind)}</td><td>${esc(p.attempts)}</td><td>${esc(p.last_error)}</td>`
    + `<td><button onclick="retryPending('${esc(p.id)}')">重试</button></td></tr>`
  ).join('') || '<tr><td colspan="5" class="muted">无待续项</td></tr>';
}

async function verifyReceipt(id, version) {
  const response = await fetch('/api/entities/' + encodeURIComponent(id) + '/actions', {
    method: 'POST',
    headers: headers('POST'),
    body: JSON.stringify({action: 'verify', data: {confirmed: true}, expected_version: version})
  });
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
  refresh();
}

async function retryPending(id) {
  const response = await fetch('/api/pending/' + encodeURIComponent(id) + '/retry', {
    method: 'POST',
    headers: headers('POST')
  });
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
  refresh();
}

async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

refresh();
</script>
</body>
</html>
