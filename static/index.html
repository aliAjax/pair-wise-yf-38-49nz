<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因组数据访问治理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .panel section { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; }
    .panel h2 { margin-top: 0; font-size: 1.05rem; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #e5e7eb; }
    th { color: #6b7280; font-weight: 600; }
    .empty { color: #9ca3af; font-style: italic; }
    .status-pending { color: #b45309; font-weight: 600; }
    .status-open { color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>基因组数据访问治理</h1>
  <p>机构停用治理：凭证到期或撤销后核对销毁回执，未结申请存在时新凭证不能启用。</p>
  <p>
    <button onclick="checkHealth()">检查服务状态</button>
    <button onclick="loadGovernance()">刷新治理面板</button>
  </p>
  <pre id="result">等待操作</pre>

  <div class="panel">
    <section>
      <h2>未结申请</h2>
      <table id="open-apps">
        <thead><tr><th>申请编号</th><th>机构</th><th>数据集</th><th>状态</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty">点击「刷新治理面板」加载</td></tr></tbody>
      </table>
    </section>
    <section>
      <h2>待核回执</h2>
      <table id="pending-receipts">
        <thead><tr><th>回执编号</th><th>机构</th><th>凭证</th><th>状态</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty">点击「刷新治理面板」加载</td></tr></tbody>
      </table>
    </section>
  </div>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadGovernance() {
  const openStatuses = ['draft', 'submitted', 'under_review'];
  const [appsRes, receiptsRes, orgsRes, datasetsRes] = await Promise.all([
    fetch('/api/applications'),
    fetch('/api/receipts?status=pending'),
    fetch('/api/organizations'),
    fetch('/api/datasets')
  ]);
  const apps = (await appsRes.json()).items || [];
  const receipts = (await receiptsRes.json()).items || [];
  const orgs = (await orgsRes.json()).items || [];
  const datasets = (await datasetsRes.json()).items || [];

  const orgName = id => { const o = orgs.find(x => x.id === id); return o ? o.data.name : id; };
  const datasetName = id => { const d = datasets.find(x => x.id === id); return d ? d.data.name : id; };

  const openApps = apps.filter(a => openStatuses.includes(a.status));
  const appsBody = document.querySelector('#open-apps tbody');
  appsBody.innerHTML = '';
  if (!openApps.length) {
    appsBody.innerHTML = '<tr><td colspan="4" class="empty">无未结申请</td></tr>';
  } else {
    for (const a of openApps) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + a.id + '</td>' +
        '<td>' + orgName(a.data.organization_id) + '</td>' +
        '<td>' + datasetName(a.data.dataset_id) + '</td>' +
        '<td class="status-open">' + a.status + '</td>';
      appsBody.appendChild(tr);
    }
  }

  const receiptsBody = document.querySelector('#pending-receipts tbody');
  receiptsBody.innerHTML = '';
  if (!receipts.length) {
    receiptsBody.innerHTML = '<tr><td colspan="4" class="empty">无待核回执</td></tr>';
  } else {
    for (const r of receipts) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + r.id + '</td>' +
        '<td>' + orgName(r.data.organization_id) + '</td>' +
        '<td>' + r.data.grant_id + '</td>' +
        '<td class="status-pending">' + r.status + '</td>';
      receiptsBody.appendChild(tr);
    }
  }
}
</script>
</body>
</html>
